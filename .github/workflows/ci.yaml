name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  APP_ENV: testing
  APP_DEBUG: "false"
  APP_KEY: ThisIsARandomStringForTests12345
  APP_TIMEZONE: UTC
  APP_URL: http://localhost/
  CACHE_DRIVER: array
  MAIL_MAILER: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync
  GUZZLE_TIMEOUT: 60
  GUZZLE_CONNECT_TIMEOUT: 60

jobs:
  sqlite:
    name: SQLite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: [8.3, 8.4, 8.5]
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: testing.sqlite
    steps:
      - name: Code Checkout
        uses: actions/checkout@v6

      - name: Get cache directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, gd, mbstring, mysql, openssl, pdo, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-suggest --no-progress --no-scripts

      - name: Create SQLite file
        run: touch database/testing.sqlite

      - name: Run Migrations
        run: php artisan migrate --force --seed

      - name: Unit tests
        run: vendor/bin/pest tests/Unit --parallel --do-not-fail-on-phpunit-warning
        env:
          DB_HOST: UNIT_NO_DB
          SKIP_MIGRATIONS: true

      - name: Integration tests
        run: vendor/bin/pest tests/Integration --parallel --do-not-fail-on-phpunit-warning
        env:
          CREATE_SNAPSHOTS: "false"

      # Panel/authorization tests, nothing database specific, so the sqlite job covers them.
      - name: Filament tests
        run: vendor/bin/pest tests/Filament --parallel --do-not-fail-on-phpunit-warning
        env:
          CREATE_SNAPSHOTS: "false"

  mysql:
    name: MySQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: [8.5]
        database: ["mysql:8.4", "mysql:9.6"]
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: testing
        ports:
          - 3306
        options: --tmpfs /var/lib/mysql:rw --health-cmd="mysqladmin ping" --health-interval=2s --health-timeout=5s --health-retries=30
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_DATABASE: testing
      DB_USERNAME: root
    steps:
      - name: Code Checkout
        uses: actions/checkout@v6

      - name: Get cache directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, gd, mbstring, mysql, openssl, pdo, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-suggest --no-progress --no-scripts

      - name: Run Migrations
        run: php artisan migrate --force --seed
        env:
          DB_PORT: ${{ job.services.database.ports[3306] }}
          DB_USERNAME: root

      - name: Integration tests
        run: vendor/bin/pest tests/Integration --parallel --do-not-fail-on-phpunit-warning --exclude-group api-fixtures
        env:
          DB_PORT: ${{ job.services.database.ports[3306] }}
          DB_USERNAME: root

  mariadb:
    name: MariaDB
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: [8.5]
        database: ["mariadb:10.11", "mariadb:11.4"]
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: testing
        ports:
          - 3306
        options: --tmpfs /var/lib/mysql:rw --health-cmd="mariadb-admin ping || mysqladmin ping" --health-interval=2s --health-timeout=5s --health-retries=30
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_DATABASE: testing
      DB_USERNAME: root
    steps:
      - name: Code Checkout
        uses: actions/checkout@v6

      - name: Get cache directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, gd, mbstring, mysql, openssl, pdo, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-suggest --no-progress --no-scripts

      - name: Run Migrations
        run: php artisan migrate --force --seed
        env:
          DB_PORT: ${{ job.services.database.ports[3306] }}
          DB_USERNAME: root

      - name: Integration tests
        run: vendor/bin/pest tests/Integration --parallel --do-not-fail-on-phpunit-warning --exclude-group api-fixtures
        env:
          DB_PORT: ${{ job.services.database.ports[3306] }}
          DB_USERNAME: root

  postgresql:
    name: PostgreSQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: [8.5]
        database: ["postgres:17", "postgres:18"]
        include:
          # postgres:17 stores data in /var/lib/postgresql/data, 18+ requires a
          # single mount at /var/lib/postgresql and errors on a data submount
          - database: "postgres:17"
            tmpfs: /var/lib/postgresql/data
          - database: "postgres:18"
            tmpfs: /var/lib/postgresql
    services:
      database:
        image: ${{ matrix.database }}
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --tmpfs ${{ matrix.tmpfs }}:rw
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - name: Code Checkout
        uses: actions/checkout@v6

      - name: Get cache directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, gd, mbstring, mysql, openssl, pdo, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-suggest --no-progress --no-scripts

      - name: Run Migrations
        run: php artisan migrate --force --seed

      - name: Integration tests
        run: vendor/bin/pest tests/Integration --parallel --do-not-fail-on-phpunit-warning --exclude-group api-fixtures

  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: testing.sqlite
      COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
    steps:
      - name: Code Checkout
        uses: actions/checkout@v6

      - name: Get cache directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-8.4-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-8.4-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: bcmath, curl, gd, mbstring, mysql, openssl, pdo, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-suggest --no-progress --no-scripts

      # Scramble Pro adds native laravel-data schema inference. The satis credentials
      # live in the COMPOSER_AUTH secret, so fork PRs skip this step and the job still
      # exports and lints with the free package.
      - name: Install Scramble Pro
        if: env.COMPOSER_AUTH != ''
        run: |
          composer config repositories.dedoc composer https://satis.dedoc.co
          composer require dedoc/scramble-pro:0.9.15 --no-interaction --no-progress --no-scripts

      - name: Create SQLite file
        run: touch database/testing.sqlite

      - name: Run Migrations
        run: php artisan migrate --force --seed

      - name: Export OpenAPI specs
        run: |
          php artisan scramble:export --api=application --path=application-openapi.json
          php artisan scramble:export --api=client --path=client-openapi.json

      # Scramble emits the additionalItems keyword, which JSON Schema 2020-12 dropped,
      # so the raw export fails structural validation.
      - name: Normalize specs
        run: |
          for f in application-openapi.json client-openapi.json; do
            jq 'walk(if type == "object" then del(.additionalItems) else . end)' "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done

      - name: Lint specs
        run: npx --yes @redocly/cli@2.47.0 lint application-openapi.json client-openapi.json

      - name: Upload specs
        uses: actions/upload-artifact@v4
        with:
          name: openapi-specs
          path: |
            application-openapi.json
            client-openapi.json
